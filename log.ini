[loggers]
keys=root

[handlers]
keys=logconsole,hand01

[formatters]
keys=logformatter

[logger_root]
level=INFO
handlers=logconsole,hand01

[formatter_logformatter]
format=[%(asctime)s.%(msecs)03d] %(levelname)s [%(thread)d] - %(message)s

[handler_hand01]
class=handlers.ConcurrentRotatingFileHandler
level=NOTSET
formatter=logformatter
args=("logs/logfile.log", "a", 10*1024*1024, 9999)

[handler_logconsole]
class=StreamHandler
level=INFO
formatter=logformatter
args=()